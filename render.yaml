databases:
  - name: scamshield-n8n-db
    databaseName: n8n
    user: n8n
    plan: basic-256mb
    postgresMajorVersion: "16"
    ipAllowList: []

services:
  - type: web
    name: scamshield-n8n
    runtime: image
    image:
      url: docker.io/n8nio/n8n:2.9.4
    plan: starter
    region: singapore
    healthCheckPath: /healthz
    disk:
      name: n8n-data
      mountPath: /home/node/.n8n
      sizeGB: 1
    envVars:
      - key: PORT
        value: "5678"
      - key: N8N_PORT
        value: "5678"
      - key: N8N_HOST
        value: scamshield-n8n.onrender.com
      - key: N8N_PROTOCOL
        value: https
      - key: N8N_EDITOR_BASE_URL
        value: https://scamshield-n8n.onrender.com/
      - key: WEBHOOK_URL
        value: https://scamshield-n8n.onrender.com/
      - key: N8N_PROXY_HOPS
        value: "1"
      - key: N8N_DIAGNOSTICS_ENABLED
        value: "false"
      - key: N8N_PERSONALIZATION_ENABLED
        value: "false"
      - key: N8N_SECURE_COOKIE
        value: "true"
      - key: N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS
        value: "true"
      - key: N8N_RUNNERS_ENABLED
        value: "true"
      - key: N8N_BLOCK_ENV_ACCESS_IN_NODE
        value: "false"
      - key: DB_TYPE
        value: postgresdb
      - key: DB_POSTGRESDB_HOST
        fromDatabase:
          name: scamshield-n8n-db
          property: host
      - key: DB_POSTGRESDB_PORT
        fromDatabase:
          name: scamshield-n8n-db
          property: port
      - key: DB_POSTGRESDB_DATABASE
        fromDatabase:
          name: scamshield-n8n-db
          property: database
      - key: DB_POSTGRESDB_USER
        fromDatabase:
          name: scamshield-n8n-db
          property: user
      - key: DB_POSTGRESDB_PASSWORD
        fromDatabase:
          name: scamshield-n8n-db
          property: password
      - key: EXECUTIONS_DATA_PRUNE
        value: "true"
      - key: EXECUTIONS_DATA_MAX_AGE
        value: "336"
      - key: GENERIC_TIMEZONE
        value: Asia/Kolkata
      - key: TZ
        value: Asia/Kolkata
      - key: N8N_ENCRYPTION_KEY
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        sync: false
      - key: OPENAI_API_URL
        value: https://api.openai.com/v1/chat/completions
      - key: MAX_SEARCH_RESULTS
        value: "5"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHANNEL_ID
        sync: false
