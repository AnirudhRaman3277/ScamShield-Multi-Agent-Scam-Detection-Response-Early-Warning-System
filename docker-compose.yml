services:
  n8n:
    image: n8nio/n8n:latest
    container_name: scam-alert-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    env_file:
      - .env
    environment:
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_PERSONALIZATION_ENABLED=false
      - GENERIC_TIMEZONE=Asia/Kolkata
      - TZ=Asia/Kolkata
      - WEBHOOK_URL=${WEBHOOK_URL:-http://localhost:5678/}
      - N8N_EDITOR_BASE_URL=${N8N_EDITOR_BASE_URL:-http://localhost:5678/}
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      ollama:
        condition: service_started

  ollama:
    image: ollama/ollama:latest
    container_name: scam-alert-ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama

  ollama-pull-model:
    image: ollama/ollama:latest
    container_name: scam-alert-ollama-model-pull
    restart: "no"
    environment:
      - OLLAMA_HOST=http://ollama:11434
    command: ["pull", "${OPENAI_MODEL:-llama3.2:3b}"]
    depends_on:
      ollama:
        condition: service_started

volumes:
  n8n_data:
  ollama_data:
